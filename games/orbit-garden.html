<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Garden</title><style>body{margin:0;background:#080b17;color:#e4e8ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(94vw,700px)}h1{color:#c5a7ff}canvas{width:100%;border-radius:50%;background:radial-gradient(circle,#1c2450,#090c19 70%);touch-action:none}button{padding:10px;border-radius:9px;border:1px solid #505780;background:#1a2040;color:white;cursor:pointer}</style><div class="box"><h1>Orbit Garden</h1><p>Click or tap to plant stars. Each one traces a little orbit.</p><canvas id="c" width="650" height="520"></canvas><p><button onclick="stars=[]">Clear garden</button> <span id="count">0 stars</span></p></div><script>const c=document.querySelector('#c'),ctx=c.getContext('2d');let stars=[];c.onclick=e=>{let r=c.getBoundingClientRect();stars.push({x:(e.clientX-r.left)*650/r.width,y:(e.clientY-r.top)*520/r.height,h:Math.random()*360,a:Math.random()*6.28,s:1+Math.random()*2})};function frame(){ctx.clearRect(0,0,650,520);ctx.strokeStyle='#28305b';for(let r=35;r<245;r+=35){ctx.beginPath();ctx.ellipse(325,260,r,r*.72,0,0,7);ctx.stroke()}ctx.fillStyle='#ffe98a';ctx.shadowBlur=24;ctx.shadowColor='#ffe98a';ctx.beginPath();ctx.arc(325,260,8,0,7);ctx.fill();ctx.shadowBlur=0;stars.forEach(s=>{s.a+=.008/s.s;ctx.fillStyle=`hsl(${s.h} 90% 72%)`;ctx.beginPath();ctx.arc(s.x+Math.cos(s.a)*s.s*18,s.y+Math.sin(s.a)*s.s*13,2.5,0,7);ctx.fill()});document.querySelector('#count').textContent=stars.length+' stars';requestAnimationFrame(frame)}frame()</script></html>
