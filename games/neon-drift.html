<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Drift</title><style>*{box-sizing:border-box}body{margin:0;background:#090c18;color:#e9efff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(92vw,560px)}h1{margin:.2rem 0;color:#76f7e4}p{color:#9faccc}canvas{width:100%;background:radial-gradient(ellipse at 50% 100%,#172346,#090c18 75%);border:1px solid #26395c;border-radius:16px;touch-action:none}header{display:flex;justify-content:space-between;align-items:center}</style><div class="wrap"><header><h1>NEON DRIFT</h1><b id="score">0 m</b></header><p>Move with ← → or A/D. Touch the left or right side on mobile.</p><canvas id="c" width="520" height="620"></canvas><p id="msg">Press a direction or tap to begin.</p></div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),score=document.querySelector('#score'),msg=document.querySelector('#msg');let player=260,gates=[],t=0,alive=false,keys={};function start(){if(alive)return;alive=true;gates=[];t=0;player=260;msg.textContent='Dodge the gates!';requestAnimationFrame(loop)}onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','a','d'].includes(e.key.toLowerCase()))start()};onkeyup=e=>keys[e.key.toLowerCase()]=false;c.onpointerdown=e=>{start();player=e.offsetX/(c.clientWidth/520)*520};function loop(){if(!alive)return;t++;if(t%52===0){let gap=100,center=55+Math.random()*410;gates.push({y:-20,center,gap})}if(keys.arrowleft||keys.a)player-=5;if(keys.arrowright||keys.d)player+=5;player=Math.max(12,Math.min(508,player));x.clearRect(0,0,520,620);x.fillStyle='#76f7e4';x.shadowBlur=18;x.shadowColor='#76f7e4';x.fillRect(player-9,530,18,28);x.shadowBlur=0;for(const g of gates){g.y+=3+Math.min(4,t/1600);x.fillStyle='#ff4db8';x.fillRect(0,g.y,g.center-g.gap/2,14);x.fillRect(g.center+g.gap/2,g.y,520,14);if(g.y>510&&g.y<558&&(player<g.center-g.gap/2+10||player>g.center+g.gap/2-10)){alive=false;msg.textContent='Signal lost. Tap the track to retry.'}}gates=gates.filter(g=>g.y<640);score.textContent=Math.floor(t/6)+' m';if(alive)requestAnimationFrame(loop)}</script></html>
