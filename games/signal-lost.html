<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Lost</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1019;color:#eaf3ff;font:16px system-ui}.card{width:min(92vw,560px);padding:28px;border:1px solid #294057;border-radius:20px;background:#111b29}h1{color:#74e6c4}label{display:block;margin:22px 0}input{width:100%;accent-color:#74e6c4}button{padding:12px 18px;border:0;border-radius:9px;background:#74e6c4;font-weight:bold;cursor:pointer}#out{min-height:2em;color:#ffd477}</style><main class="card"><h1>Signal Lost</h1><p>A transmission is hiding a three-number access code. Tune the dials and decode it.</p><label>Frequency <input id="a" type="range" min="0" max="9" value="5"><span id="av">5</span></label><label>Phase <input id="b" type="range" min="0" max="9" value="5"><span id="bv">5</span></label><label>Echo <input id="d" type="range" min="0" max="9" value="5"><span id="dv">5</span></label><button id="go">Decode transmission</button><p id="out">The receiver is waiting…</p><button id="new" style="background:#34465c;color:white">New transmission</button></main><script>let code=[];function fresh(){code=Array.from({length:3},()=>Math.floor(Math.random()*10));document.querySelector('#out').textContent='A new transmission is coming through.'}['a','b','d'].forEach(id=>document.querySelector('#'+id).oninput=e=>document.querySelector('#'+id+'v').textContent=e.target.value);document.querySelector('#go').onclick=()=>{let guess=['a','b','d'].map(id=>+document.querySelector('#'+id).value),exact=guess.filter((v,i)=>v===code[i]).length,near=guess.filter(v=>code.includes(v)).length;document.querySelector('#out').textContent=exact===3?'TRANSMISSION DECODED. You found the code!':`${exact} dial${exact===1?'':'s'} in the right place · ${near} matching digit${near===1?'':'s'} total.`};document.querySelector('#new').onclick=fresh;fresh()</script></html>
