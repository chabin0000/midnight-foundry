<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Foundry — Small tools. Big possibilities.</title><link rel="stylesheet" href="style.css"><main><nav><strong>◈ POCKET FOUNDRY</strong><span>OPEN SOURCE / LOCAL FIRST</span></nav><p class="eyebrow">A SMALL INTERNET TOOLBOX</p><h1>Small tools.<br>Big possibilities.</h1><p>Thirty experiments for your browser. No installs, accounts, API keys or tracking.</p><label>Search the collection<input id="search" type="search" placeholder="Try design, JSON, game…"></label><p id="count" aria-live="polite"></p><div class="grid" id="catalog"></div><footer>MIT licensed. All input processing stays in this browser.</footer></main><script type="module">const data=await(await fetch('./catalog.json')).json();const render=()=>{const q=document.querySelector('#search').value.toLowerCase();const items=data.filter(a=>(a.name+' '+a.description+' '+a.category).toLowerCase().includes(q));document.querySelector('#count').textContent=items.length+' tools ready';document.querySelector('#catalog').replaceChildren(...items.map(a=>{const link=document.createElement('a');link.className='card';link.href='apps/'+a.id+'.html';const tag=document.createElement('span');tag.textContent=a.category;const title=document.createElement('h2');title.textContent=a.name;const p=document.createElement('p');p.textContent=a.description;link.append(tag,title,p);return link;}));};document.querySelector('#search').oninput=render;render();</script></html>
