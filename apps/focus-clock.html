<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Clock · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Productivity</span></nav><h1>Focus Clock</h1><p>A deadline-based focus timer that survives sleeping tabs.</p><section><label>Minutes<input type="number" id="minutes" min="1" max="180" value="25"></label><div class="big" id="clock" role="timer"></div><button id="start">Start / Resume</button><button id="pause">Pause</button><button id="reset">Reset</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};let remaining=1500000,deadline=0,running=false;const draw=()=>{if(running){remaining=Math.max(0,deadline-Date.now());if(!remaining){running=false;show('Session complete');}}const s=Math.ceil(remaining/1000);$('#clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};$('#start').onclick=()=>{if(!running){deadline=Date.now()+remaining;running=true;}};$('#pause').onclick=()=>{draw();running=false;};$('#reset').onclick=()=>{running=false;remaining=Math.min(180,Math.max(1,Number($('#minutes').value)||25))*60000;draw();};setInterval(draw,200);draw();</script></html>
