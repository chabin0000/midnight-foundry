<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life Garden · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Simulation</span></nav><h1>Life Garden</h1><p>Paint cells in Conway’s Game of Life on a wrapping grid.</p><section><button id="toggle">Run / Pause</button><button id="step">Step</button><button id="random">Randomize</button><button id="clear">Clear</button><canvas width="640" height="480"></canvas><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const c=$('canvas'),ctx=c.getContext('2d'),w=40,h=30;let cells=Array(w*h).fill(0),running=false,g=0;const draw=()=>{ctx.fillStyle='#101624';ctx.fillRect(0,0,640,480);cells.forEach((v,i)=>{if(v){ctx.fillStyle='#a9f575';ctx.fillRect(i%w*16+1,Math.floor(i/w)*16+1,14,14);}});show('Generation '+g+' · Live cells '+cells.reduce((a,b)=>a+b,0));};const step=()=>{cells=core.life(cells,w,h);g++;draw();};$('#toggle').onclick=()=>running=!running;$('#step').onclick=step;$('#clear').onclick=()=>{cells.fill(0);g=0;draw();};$('#random').onclick=()=>{cells=cells.map(()=>Math.random()<.25?1:0);g=0;draw();};c.onpointerdown=e=>{const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*w),y=Math.floor((e.clientY-r.top)/r.height*h);if(x>=0&&x<w&&y>=0&&y<h){cells[y*w+x]^=1;draw();}};setInterval(()=>{if(running)step();},120);$('#random').click();</script></html>
