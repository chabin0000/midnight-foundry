<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette Dice · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Design</span></nav><h1>Palette Dice</h1><p>Generate repeatable palettes from a numeric seed.</p><section><label>Seed<input type="number" id="seed" value="42"></label><button id="go">Generate</button><div class="row" id="colors"></div><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const run=()=>{const r=core.seeded(Number($('#seed').value));const colors=Array.from({length:5},()=>`hsl(${Math.floor(r()*360)} 70% ${35+Math.floor(r()*40)}%)`);$('#colors').replaceChildren(...colors.map(c=>{const e=document.createElement('div');e.className='swatch';e.style.background=c;e.textContent=c;return e;}));show(':root {\n'+colors.map((c,i)=>`  --color-${i+1}: ${c};`).join('\n')+'\n}');};$('#go').onclick=run;run();</script></html>
