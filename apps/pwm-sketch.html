<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PWM Sketch · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Electronics</span></nav><h1>PWM Sketch</h1><p>Draw an ideal PWM signal and calculate average voltage.</p><section><label>Duty (%)<input id="duty" type="range" min="0" max="100" value="50"></label><label>Supply (V)<input id="v" type="number" value="5" step="any"></label><canvas width="800" height="280"></canvas><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const c=$('canvas'),ctx=c.getContext('2d');const run=()=>{const d=Number($('#duty').value)/100,v=Number($('#v').value);ctx.clearRect(0,0,800,280);ctx.strokeStyle='#a9f575';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<800;x++){const y=x%160<160*d?45:230;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();show({duty_percent:d*100,average_voltage:v*d,note:'Ideal switching waveform; not a motor simulation.'});};$('#duty').oninput=$('#v').oninput=run;run();</script></html>
