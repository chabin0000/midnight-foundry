<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gradient Forge · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Design</span></nav><h1>Gradient Forge</h1><p>Create a CSS gradient with a live preview.</p><section><label>Start<input type="color" id="a" value="#8b5cf6"></label><label>End<input type="color" id="b" value="#22d3ee"></label><label>Angle<input id="angle" type="range" min="0" max="360" value="135"></label><div id="preview" style="height:280px;border-radius:16px"></div><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const run=()=>{const s=`linear-gradient(${$('#angle').value}deg, ${$('#a').value}, ${$('#b').value})`;$('#preview').style.background=s;show('background: '+s+';');};for(const e of document.querySelectorAll('input'))e.oninput=run;run();</script></html>
