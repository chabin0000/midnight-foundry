<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sort Stage · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Algorithms</span></nav><h1>Sort Stage</h1><p>Watch insertion sort arrange a shuffled set of bars.</p><section><button id="shuffle">Shuffle</button><button id="go">Sort</button><canvas width="800" height="360"></canvas><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const ctx=$('canvas').getContext('2d');let a=[],i=1,j=1,running=false,moves=0;const draw=()=>{ctx.clearRect(0,0,800,360);a.forEach((v,k)=>{ctx.fillStyle=k===j?'#fb923c':'#a9f575';ctx.fillRect(k*20+2,360-v*8,16,v*8);});show('Comparisons: '+moves);};$('#shuffle').onclick=()=>{running=false;a=Array.from({length:40},(_,i)=>i+1);for(let k=39;k>0;k--){const n=Math.floor(Math.random()*(k+1));[a[k],a[n]]=[a[n],a[k]];}i=j=1;moves=0;draw();};$('#go').onclick=()=>running=true;setInterval(()=>{if(!running)return;if(i>=a.length){running=false;show('Sorted · '+moves+' comparisons');return;}moves++;if(j>0&&a[j]<a[j-1]){[a[j],a[j-1]]=[a[j-1],a[j]];j--;}else{i++;j=i;}draw();},35);$('#shuffle').click();</script></html>
