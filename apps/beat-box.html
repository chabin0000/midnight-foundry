<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beat Box · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Music</span></nav><h1>Beat Box</h1><p>A four-voice, sixteen-step drum sequencer using synthesized sounds.</p><section><label>Tempo<input id="bpm" type="number" min="40" max="240" value="110"></label><button id="toggle">Play / Stop</button><div id="board" style="overflow-x:auto"></div><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};let audio,timer,step=0;const pattern=Array.from({length:4},()=>Array(16).fill(false));const board=$('#board');for(let r=0;r<4;r++){const row=document.createElement('div');row.style.whiteSpace='nowrap';for(let s=0;s<16;s++){const b=document.createElement('button');b.textContent='·';b.style.padding='8px';b.setAttribute('aria-label','Voice '+(r+1)+' step '+(s+1));b.onclick=()=>{pattern[r][s]=!pattern[r][s];b.textContent=pattern[r][s]?'●':'·';};row.append(b);}board.append(row);}const tick=()=>{show('Step '+(step+1));pattern.forEach((row,r)=>{if(row[step]){const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=r===3?'square':'sine';o.frequency.setValueAtTime([110,220,440,880][r],t);o.frequency.exponentialRampToValueAtTime([40,80,180,400][r],t+.12);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.16);}});step=(step+1)%16;timer=setTimeout(tick,60000/Math.min(240,Math.max(40,Number($('#bpm').value)||110))/4);};$('#toggle').onclick=async()=>{if(timer){clearTimeout(timer);timer=null;show('Stopped');}else{audio??=new AudioContext();await audio.resume();tick();}};</script></html>
