<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohm Lab · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Electronics</span></nav><h1>Ohm Lab</h1><p>Explore ideal resistor current and power.</p><section><label>Voltage (V)<input id="v" type="number" value="5" step="any"></label><label>Resistance (Ω)<input id="r" type="number" value="1000" step="any"></label><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const run=()=>safe(()=>{const r=core.resistor(Number($('#v').value),Number($('#r').value));show({current_mA:r.current*1000,power_mW:r.power*1000,note:'Ideal resistor only. Real component tolerances and ratings are not modeled.'});});$('#v').oninput=$('#r').oninput=run;run();</script></html>
