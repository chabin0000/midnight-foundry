<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Desk · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Developer</span></nav><h1>Binary Desk</h1><p>Convert arbitrary-size integers between decimal, hexadecimal and binary.</p><section><label>Integer<input id="n" value="255"></label><label>Input base<select id="base"><option value="10">Decimal</option><option value="16">Hexadecimal (unsigned)</option><option value="2">Binary (unsigned)</option></select></label><button id="go">Convert</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#go').onclick=()=>safe(()=>{const s=$('#n').value.trim(),b=$('#base').value;if(!(b==='10'?/^-?\d+$/:b==='16'?/^[0-9a-f]+$/i:/^[01]+$/).test(s))throw Error('Invalid integer for selected base');const n=BigInt((b==='16'?'0x':b==='2'?'0b':'')+s);show({decimal:n.toString(10),hexadecimal:n.toString(16),binary:n.toString(2)});});$('#go').click();</script></html>
