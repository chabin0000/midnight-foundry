<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Dice · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Productivity</span></nav><h1>Decision Dice</h1><p>Choose a nonempty line with cryptographic randomness.</p><section><label>Input<textarea id="input" spellcheck="false"></textarea></label><button id="go">Pick one</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#go').onclick=()=>safe(()=>{const choices=$('#input').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!choices.length)throw Error('Enter choices');const a=new Uint32Array(1),limit=Math.floor(4294967296/choices.length)*choices.length;do{crypto.getRandomValues(a);}while(a[0]>=limit);show(choices[a[0]%choices.length]);});</script></html>
