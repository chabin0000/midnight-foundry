<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Notes · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Productivity</span></nav><h1>Local Notes</h1><p>A plain text scratchpad saved in this browser, with file export.</p><section><label>Input<textarea id="input" spellcheck="false"></textarea></label><button id="save">Download text</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};try{$('#input').value=localStorage.getItem('pocket-notes')||'';}catch{}$('#input').oninput=()=>{try{localStorage.setItem('pocket-notes',$('#input').value);show('Saved in this browser');}catch{show('Storage unavailable. Download to keep a copy.');}};$('#save').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([$('#input').value],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};</script></html>
