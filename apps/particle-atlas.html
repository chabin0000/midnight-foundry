<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Atlas · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Simulation</span></nav><h1>Particle Atlas</h1><p>Move the pointer to attract particles; pause to inspect.</p><section><button id="pause">Pause / Resume</button><canvas width="800" height="450"></canvas></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const c=$('canvas'),ctx=c.getContext('2d');let active=true,target={x:400,y:225};const points=Array.from({length:140},()=>({x:Math.random()*800,y:Math.random()*450,vx:0,vy:0}));c.onpointermove=e=>{const r=c.getBoundingClientRect();target={x:(e.clientX-r.left)/r.width*800,y:(e.clientY-r.top)/r.height*450};};$('#pause').onclick=()=>active=!active;const frame=()=>{if(active){ctx.fillStyle='rgba(16,22,36,.18)';ctx.fillRect(0,0,800,450);for(const p of points){const dx=target.x-p.x,dy=target.y-p.y,d=Math.max(100,dx*dx+dy*dy);p.vx=(p.vx+dx/d*4)*.99;p.vy=(p.vy+dy/d*4)*.99;p.x=(p.x+p.vx+800)%800;p.y=(p.y+p.vy+450)%450;ctx.fillStyle='#a9f575';ctx.fillRect(p.x,p.y,2,2);}}requestAnimationFrame(frame);};frame();</script></html>
