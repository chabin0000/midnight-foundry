<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrast Meter · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Design</span></nav><h1>Contrast Meter</h1><p>Check relative luminance contrast of text and background.</p><section><label>Text<input type="color" id="a" value="#ffffff"></label><label>Background<input type="color" id="b" value="#10131b"></label><section id="preview">Readable design starts here.</section><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const run=()=>{const a=$('#a').value,b=$('#b').value,r=core.contrast(a,b);$('#preview').style.color=a;$('#preview').style.background=b;show({ratio:r.toFixed(2)+':1',normalAA:r>=4.5,normalAAA:r>=7,largeAA:r>=3});};$('#a').oninput=$('#b').oninput=run;run();</script></html>
