<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Zone Board</title><style>body{background:#101722;color:#ecf3ff;font:16px system-ui;max-width:800px;margin:50px auto;padding:20px}h1{color:#89d7ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:#1b293b;padding:20px;border-radius:14px}.time{font-size:2rem;font-variant-numeric:tabular-nums}input,button{padding:10px;border-radius:8px;border:0}button{cursor:pointer}</style><h1>Time Zone Board</h1><p>Compare local times around the world. Add a time zone using an IANA name such as Europe/Paris.</p><form id="form"><input id="zone" list="zones" placeholder="Asia/Seoul" required><datalist id="zones"><option>Asia/Seoul</option><option>America/New_York</option><option>Europe/London</option><option>Europe/Paris</option><option>Asia/Tokyo</option><option>Australia/Sydney</option></datalist><button>Add city</button></form><p id="error" role="alert"></p><div class="grid" id="grid"></div><script>const grid=document.querySelector('#grid'),zone=document.querySelector('#zone'),err=document.querySelector('#error');let cities=JSON.parse(localStorage.timeZoneBoard||'null')||['Asia/Seoul','Europe/London','America/New_York','Asia/Tokyo'];function render(){grid.replaceChildren(...cities.map((z,i)=>{let card=document.createElement('div');card.className='card';let name=document.createElement('b');name.textContent=z;let time=document.createElement('div');time.className='time';time.textContent=new Intl.DateTimeFormat('en',{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());let date=document.createElement('div');date.textContent=new Intl.DateTimeFormat('en',{timeZone:z,weekday:'long',month:'short',day:'numeric'}).format(new Date());let del=document.createElement('button');del.textContent='Remove';del.onclick=()=>{cities.splice(i,1);localStorage.timeZoneBoard=JSON.stringify(cities);render()};card.append(name,time,date,del);return card}))}document.querySelector('#form').onsubmit=e=>{e.preventDefault();try{new Intl.DateTimeFormat('en',{timeZone:zone.value});if(!cities.includes(zone.value))cities.push(zone.value);localStorage.timeZoneBoard=JSON.stringify(cities);err.textContent='';zone.value='';render()}catch{err.textContent='Unknown time zone.'}};render();setInterval(render,1000)</script></html>
