<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File Lens</title><style>body{background:#111821;color:#eef6ff;font:16px system-ui;max-width:780px;margin:45px auto;padding:20px}h1{color:#8fe5d1}.drop{border:2px dashed #527e86;border-radius:18px;padding:45px;text-align:center;cursor:pointer}.drop.hot{background:#1d3a40}pre{background:#1d2833;padding:18px;border-radius:12px;white-space:pre-wrap;word-break:break-all}button{padding:10px;border:0;border-radius:8px;cursor:pointer}</style><h1>File Lens</h1><p>Inspect a file locally: size, type, SHA-256 digest, and a text preview. No upload.</p><div class="drop" id="drop">Drop a file here or click to choose<input id="file" type="file" hidden></div><div id="out"></div><script>const drop=document.querySelector('#drop'),file=document.querySelector('#file'),out=document.querySelector('#out');drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add('hot')};drop.ondragleave=()=>drop.classList.remove('hot');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('hot');inspect(e.dataTransfer.files[0])};file.onchange=()=>inspect(file.files[0]);async function inspect(f){if(!f)return;out.replaceChildren();let data=await f.arrayBuffer(),hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),b=>b.toString(16).padStart(2,'0')).join('');for(const [label,value] of [['Name',f.name],['Size',f.size.toLocaleString()+' bytes'],['Type',f.type||'Unknown'],['SHA-256',hash]]){let p=document.createElement('p');let b=document.createElement('b');b.textContent=label+': ';p.append(b,document.createTextNode(value));out.append(p)}if(f.type.startsWith('text/')||/\.(json|csv|md|txt|js|css|html)$/i.test(f.name)){let h=document.createElement('h2');h.textContent='Preview (first 4 KB)';let pre=document.createElement('pre');pre.textContent=await f.slice(0,4096).text();out.append(h,pre)}}</script></html>
