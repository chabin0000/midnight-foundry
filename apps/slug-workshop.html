<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slug Workshop · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Developer</span></nav><h1>Slug Workshop</h1><p>Create readable Unicode URL slugs, one per line.</p><section><label>Input<textarea id="input" spellcheck="false"></textarea></label><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#input').oninput=()=>show($('#input').value.split('\n').map(core.slug).join('\n'));</script></html>
