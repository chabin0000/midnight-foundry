<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix Clock · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Developer</span></nav><h1>Unix Clock</h1><p>Convert Unix seconds to an ISO date and back.</p><section><label>Unix seconds<input id="seconds" type="number" value="0"></label><button id="decode">To date</button><label>ISO date<input id="date" value="2026-01-01T00:00:00Z"></label><button id="encode">To seconds</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#decode').onclick=()=>safe(()=>show(new Date(Number($('#seconds').value)*1000).toISOString()));$('#encode').onclick=()=>safe(()=>{const n=Date.parse($('#date').value);if(!Number.isFinite(n))throw Error('Invalid date');show(Math.floor(n/1000));});</script></html>
