<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Sprint · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Game</span></nav><h1>Reaction Sprint</h1><p>Measure reaction time after an unpredictable cue.</p><section><button id="pad" style="width:100%;height:260px;font-size:30px">Start round</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};let state='idle',timer,start;$('#pad').onclick=()=>{if(state==='waiting'){clearTimeout(timer);state='idle';$('#pad').textContent='Too early — try again';$('#pad').style.background='';}else if(state==='ready'){const ms=Math.round(performance.now()-start);state='idle';$('#pad').textContent=ms+' ms · Play again';show('Includes display and device latency');$('#pad').style.background='';}else{state='waiting';$('#pad').textContent='Wait for green…';$('#pad').style.background='#63708a';timer=setTimeout(()=>{state='ready';start=performance.now();$('#pad').style.background='#a9f575';$('#pad').textContent='NOW!';},1000+Math.random()*3000);}};</script></html>
