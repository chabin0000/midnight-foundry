<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Ink · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Art</span></nav><h1>Orbit Ink</h1><p>Seeded generative orbital art with PNG export.</p><section><label>Seed<input id="seed" type="number" value="17"></label><button id="go">Draw</button><button id="save">Save PNG</button><canvas width="800" height="800"></canvas></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const c=$('canvas'),ctx=c.getContext('2d');const draw=()=>{const r=core.seeded(Number($('#seed').value));ctx.fillStyle='#10131b';ctx.fillRect(0,0,800,800);const a=2+Math.floor(r()*8),b=3+Math.floor(r()*10),phase=r()*Math.PI;ctx.lineWidth=.65;for(let j=0;j<10;j++){ctx.strokeStyle=`hsla(${140+j*19},85%,70%,.45)`;ctx.beginPath();for(let i=0;i<=4000;i++){const t=i/4000*Math.PI*2,x=400+Math.sin(a*t+phase+j*.02)*(330-j*12),y=400+Math.cos(b*t)*(330-j*12);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();}};$('#go').onclick=draw;$('#save').onclick=()=>{const a=document.createElement('a');a.download='orbit-ink.png';a.href=c.toDataURL();a.click();};draw();</script></html>
