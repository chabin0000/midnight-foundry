<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractal Window · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Art</span></nav><h1>Fractal Window</h1><p>Explore a Mandelbrot set; click to zoom and reset to return.</p><section><button id="reset">Reset</button><canvas width="600" height="400"></canvas><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const c=$('canvas'),ctx=c.getContext('2d');let cx=-.5,cy=0,scale=3.4;const draw=()=>{const img=ctx.createImageData(600,400);for(let y=0;y<400;y++)for(let x=0;x<600;x++){const a=cx+(x/600-.5)*scale,b=cy+(y/400-.5)*scale*2/3;let zx=0,zy=0,n=0;while(zx*zx+zy*zy<4&&n<100){const t=zx*zx-zy*zy+a;zy=2*zx*zy+b;zx=t;n++;}const k=(y*600+x)*4;img.data[k]=n===100?10:n*9%256;img.data[k+1]=n===100?15:n*5%256;img.data[k+2]=n===100?25:160+n%96;img.data[k+3]=255;}ctx.putImageData(img,0,0);show('Span: '+scale.toPrecision(4)+' · 100 iterations');};c.onclick=e=>{if(scale<1e-12)return;const r=c.getBoundingClientRect();cx+=((e.clientX-r.left)/r.width-.5)*scale;cy+=((e.clientY-r.top)/r.height-.5)*scale*2/3;scale*=.5;draw();};$('#reset').onclick=()=>{cx=-.5;cy=0;scale=3.4;draw();};draw();</script></html>
