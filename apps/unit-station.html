<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Station · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Utility</span></nav><h1>Unit Station</h1><p>Convert distance, mass and temperature units.</p><section><label>Value<input id="n" type="number" value="1" step="any"></label><label>Conversion<select id="mode"><option value="km">Kilometers → miles</option><option value="mi">Miles → kilometers</option><option value="kg">Kilograms → pounds</option><option value="lb">Pounds → kilograms</option><option value="c">Celsius → Fahrenheit</option><option value="f">Fahrenheit → Celsius</option></select></label><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const run=()=>{const n=Number($('#n').value);const f={km:n/1.609344,mi:n*1.609344,kg:n/0.45359237,lb:n*0.45359237,c:n*1.8+32,f:(n-32)/1.8};show(f[$('#mode').value]);};$('#n').oninput=$('#mode').onchange=run;run();</script></html>
