<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hash Desk · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Developer</span></nav><h1>Hash Desk</h1><p>Calculate a SHA-256 digest of UTF-8 text locally.</p><section><label>Input<textarea id="input" spellcheck="false"></textarea></label><button id="go">SHA-256</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#go').onclick=async()=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode($('#input').value));show([...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join(''));}catch(e){show(e.message);}};</script></html>
