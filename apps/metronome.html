<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metronome · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Music</span></nav><h1>Metronome</h1><p>Simple audible beats and a visual pulse.</p><section><label>BPM<input id="bpm" type="number" min="30" max="240" value="100"></label><button id="toggle">Play / Stop</button><div class="big" id="beat">♩</div><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};let audio,timer,count=0;const tick=()=>{count=count%4+1;$('#beat').textContent=count;const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.frequency.value=count===1?1000:650;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.07);timer=setTimeout(tick,60000/Math.min(240,Math.max(30,Number($('#bpm').value)||100)));};$('#toggle').onclick=async()=>{if(timer){clearTimeout(timer);timer=null;show('Stopped');}else{audio??=new AudioContext();await audio.resume();tick();show('Playing');}};</script></html>
