<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Desk · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Developer</span></nav><h1>URL Desk</h1><p>Inspect URL query parameters and encode URI components.</p><section><label>Input<textarea id="input" spellcheck="false"></textarea></label><button id="go">Inspect</button><button id="encode">Encode</button><button id="decode">Decode</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#go').onclick=()=>safe(()=>{const u=new URL($('#input').value);show({protocol:u.protocol,host:u.host,path:u.pathname,query:[...u.searchParams],hash:u.hash});});$('#encode').onclick=()=>show(encodeURIComponent($('#input').value));$('#decode').onclick=()=>safe(()=>show(decodeURIComponent($('#input').value)));</script></html>
