<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Diff · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Developer</span></nav><h1>Line Diff</h1><p>Compare texts using a longest common subsequence line diff.</p><section><label>Before<textarea id="a"></textarea></label><label>After<textarea id="b"></textarea></label><button id="go">Compare</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#go').onclick=()=>safe(()=>show(core.diff($('#a').value,$('#b').value)));</script></html>
