<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aspect Desk · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Design</span></nav><h1>Aspect Desk</h1><p>Find a matching image dimension for a selected aspect ratio.</p><section><label>Width<input id="width" type="number" min="1" value="1920"></label><label>Aspect<select id="ratio"><option value="1.7777777777777777">16:9</option><option value="1.3333333333333333">4:3</option><option value="1">1:1</option><option value="0.5625">9:16</option><option value="2.3333333333333335">21:9</option></select></label><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const run=()=>{const w=Number($('#width').value);if(!Number.isFinite(w)||w<=0)return show('Enter a positive width');show({width:w,height:Math.round(w/Number($('#ratio').value))});};$('#width').oninput=$('#ratio').onchange=run;run();</script></html>
