<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 Desk · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Developer</span></nav><h1>Base64 Desk</h1><p>Encode and decode UTF-8 text including Korean and emoji.</p><section><label>Input<textarea id="input" spellcheck="false"></textarea></label><button id="encode">Encode</button><button id="decode">Decode</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#encode').onclick=()=>safe(()=>show(core.encode64($('#input').value)));$('#decode').onclick=()=>safe(()=>show(core.decode64($('#input').value)));</script></html>
