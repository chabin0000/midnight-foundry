<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Grid · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Game</span></nav><h1>Memory Grid</h1><p>Match eight pairs in sixteen shuffled cards.</p><section><button id="reset">New game</button><div id="board" class="grid" style="grid-template-columns:repeat(4,1fr)"></div><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};let deck,open=[],matched=new Set(),moves=0,locked=false,version=0;const render=()=>{$('#board').replaceChildren(...deck.map((v,i)=>{const b=document.createElement('button');b.textContent=matched.has(i)||open.includes(i)?v:'?';b.style.minHeight='70px';b.setAttribute('aria-label','Card '+(i+1));b.disabled=matched.has(i)||locked;b.onclick=()=>{if(open.includes(i))return;open.push(i);render();if(open.length===2){moves++;const [a,b]=open;if(deck[a]===deck[b]){matched.add(a);matched.add(b);open=[];render();}else{locked=true;render();const current=version;setTimeout(()=>{if(current!==version)return;open=[];locked=false;render();},750);}}};return b;}));show(matched.size===16?'Complete in '+moves+' moves!':'Moves: '+moves+' · Pairs: '+matched.size/2);};$('#reset').onclick=()=>{version++;deck=[...'ABCDEFGHABCDEFGH'];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}open=[];matched=new Set();moves=0;locked=false;render();};$('#reset').click();</script></html>
