<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Track · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Game</span></nav><h1>Typing Track</h1><p>Practice typing with elapsed-time speed and positional accuracy.</p><section><p id="target"></p><label>Input<textarea id="input" spellcheck="false"></textarea></label><button id="reset">Reset</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};const target='Small tools make room for big ideas. Build something useful and keep learning.';$('#target').textContent=target;let start=0;$('#input').oninput=()=>{if(!start)start=performance.now();const s=$('#input').value,minutes=Math.max((performance.now()-start)/60000,1/60000);let correct=0;for(let i=0;i<s.length;i++)if(s[i]===target[i])correct++;show({words_per_minute:Math.round(s.length/5/minutes),accuracy:s.length?(100*correct/s.length).toFixed(1)+'%':'100%',complete:s===target});if(s===target)$('#input').disabled=true;};$('#reset').onclick=()=>{start=0;$('#input').disabled=false;$('#input').value='';show('Type to begin');};$('#reset').click();</script></html>
