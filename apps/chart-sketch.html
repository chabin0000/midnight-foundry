<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart Sketch</title><style>body{margin:0;background:#0d1420;color:#eff6ff;font:16px system-ui;max-width:900px;padding:24px;margin:auto}h1{color:#a6e1ff}textarea{width:100%;height:120px;background:#1b2a3b;color:white;border:1px solid #496378;border-radius:10px;padding:12px;box-sizing:border-box}canvas{width:100%;background:#152233;border-radius:16px;margin-top:20px}button{padding:11px 17px;background:#a6e1ff;border:0;border-radius:9px;cursor:pointer}</style><h1>Chart Sketch</h1><p>Enter label, value pairs. Draw a bar chart and save it as PNG.</p><textarea id="input">Apples, 12\nPears, 8\nOranges, 17\nGrapes, 5</textarea><p><button id="draw">Draw chart</button> <button id="save">Save PNG</button></p><p id="error" role="alert"></p><canvas id="chart" width="900" height="500"></canvas><script>const c=document.querySelector('#chart'),x=c.getContext('2d'),input=document.querySelector('#input'),err=document.querySelector('#error');function render(){let rows=input.value.split(/\r?\n/).filter(Boolean).map(line=>{let at=line.lastIndexOf(',');return [line.slice(0,at).trim(),Number(line.slice(at+1).trim())]});if(!rows.length||rows.length>20||rows.some(([name,n])=>!name||!Number.isFinite(n)||n<0)){err.textContent='Use 1–20 lines of label, non-negative number.';return}err.textContent='';x.fillStyle='#152233';x.fillRect(0,0,900,500);let max=Math.max(1,...rows.map(r=>r[1])),bar=Math.min(55,700/rows.length-10),step=720/rows.length;x.font='15px system-ui';x.textAlign='center';rows.forEach(([name,n],i)=>{let px=100+step*i+step/2,h=340*n/max;x.fillStyle=`hsl(${180+i*22} 75% 65%)`;x.fillRect(px-bar/2,400-h,bar,h);x.fillStyle='#eef6ff';x.fillText(String(n),px,390-h);x.fillText(name.slice(0,12),px,430)});x.strokeStyle='#7892aa';x.beginPath();x.moveTo(70,400);x.lineTo(850,400);x.stroke()}document.querySelector('#draw').onclick=render;document.querySelector('#save').onclick=()=>{let a=document.createElement('a');a.download='chart-sketch.png';a.href=c.toDataURL('image/png');a.click()};input.value=input.value.replaceAll('\\n','\n');render()</script></html>
