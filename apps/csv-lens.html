<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Lens · Pocket Foundry</title><link rel="stylesheet" href="../style.css"><main><nav><a href="../index.html">← Pocket Foundry</a><span>Data</span></nav><h1>CSV Lens</h1><p>Parse quoted CSV into JSON using the first row as keys.</p><section><label>Input<textarea id="input" spellcheck="false"></textarea></label><button id="go">Parse</button><output id="out" aria-live="polite"></output></section><footer>Local processing · No account · No API keys</footer></main><script type="module">import * as core from '../core.js';const $=s=>document.querySelector(s);const show=v=>$('#out').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);const safe=fn=>{try{fn();}catch(e){show('Error: '+e.message);}};$('#go').onclick=()=>safe(()=>{const [h,...rows]=core.csv($('#input').value);if(!h||new Set(h).size!==h.length)throw Error('Use unique column headers');if(rows.some(r=>r.length!==h.length))throw Error('Row width differs from header');show(rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]]))));});</script></html>
