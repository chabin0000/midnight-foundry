<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constellation</title><style>*{box-sizing:border-box}body{margin:0;background:#080d20;color:#eef;font:16px system-ui}header{padding:18px 5vw;display:flex;justify-content:space-between}a,button{color:#c9d2ff}button{background:#182243;border:1px solid #394776;border-radius:10px;padding:10px 14px;cursor:pointer}canvas{position:fixed;inset:65px 0 0;width:100%;height:calc(100% - 65px);touch-action:none}.hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111a35cc;padding:12px 18px;border-radius:20px;color:#bbc6f4;white-space:nowrap}</style><header><a href="../">← Tiny Experiments</a><strong>✦ Constellation</strong><button id="clear">Clear sky</button></header><canvas id="sky"></canvas><div class="hint">Tap stars to connect them · Double tap to add a star</div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let pts=[],sel=-1,seed=Array.from({length:95},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.3,a:Math.random()*.7+.2}));function size(){let d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;x.setTransform(d,0,0,d,0,0);draw()}function draw(){let w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);seed.forEach(s=>{x.fillStyle=`rgba(190,205,255,${s.a})`;x.beginPath();x.arc(s.x*w,s.y*h,s.r,0,7);x.fill()});pts.forEach((p,i)=>{if(i){let q=pts[i-1];x.strokeStyle='#8295ff99';x.lineWidth=1.5;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(p.x,p.y);x.stroke()}x.fillStyle=i===sel?'#ffe18a':'#9eb0ff';x.beginPath();x.arc(p.x,p.y,5,0,7);x.fill();x.shadowBlur=14;x.shadowColor='#899cff';x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill();x.shadowBlur=0})}c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};if(e.detail>1){pts.push(p)}else{let i=pts.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<20);if(i>=0)sel=i;else{pts.push(p);sel=pts.length-1}}draw()});document.querySelector('#clear').onclick=()=>{pts=[];draw()};onresize=size;size();</script></html>
