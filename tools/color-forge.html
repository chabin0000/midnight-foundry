<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Forge</title><style>*{box-sizing:border-box}body{margin:0;background:#11131a;color:#f4f5fb;font:16px system-ui;min-height:100vh;display:grid;place-items:center}.app{width:min(94vw,800px)}h1{letter-spacing:.06em}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:24px 0}.swatch{height:260px;border-radius:14px;display:flex;align-items:end;padding:12px;color:white;text-shadow:0 1px 5px #000;font-weight:bold;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff26}button{padding:12px 18px;border:0;border-radius:9px;background:#dfc4ff;font-weight:bold;cursor:pointer}@media(max-width:550px){.palette{grid-template-columns:repeat(2,1fr)}.swatch{height:130px}.swatch:last-child{grid-column:span 2}}</style><main class="app"><h1>COLOR FORGE</h1><p>Lock colors you like, forge a fresh palette, and click any swatch to copy its hex code.</p><div class="palette" id="palette"></div><button id="forge">Forge palette · Space</button> <span id="note"></span></main><script>let locks=[false,false,false,false,false],colors=[];function forge(){colors=colors.length?colors:[];for(let i=0;i<5;i++)if(!locks[i])colors[i]='#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');document.querySelector('#palette').innerHTML=colors.map((c,i)=>`<div class="swatch" data-i="${i}" style="background:${c}">${c.toUpperCase()} ${locks[i]?'🔒':'◇'}</div>`).join('');document.querySelectorAll('.swatch').forEach(el=>{el.onclick=async()=>{let i=+el.dataset.i;if(event.shiftKey){locks[i]=!locks[i];forge()}else{await navigator.clipboard?.writeText(colors[i]);document.querySelector('#note').textContent=colors[i]+' copied'}}})}document.querySelector('#forge').onclick=forge;onkeydown=e=>{if(e.code==='Space'){e.preventDefault();forge()}};forge()</script></html>
