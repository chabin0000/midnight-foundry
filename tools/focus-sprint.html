<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Sprint</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101714;color:#ecfff3;font:16px system-ui}.app{text-align:center;width:min(92vw,480px)}h1{color:#a5f2bd}.clock{font-size:clamp(5rem,24vw,9rem);font-variant-numeric:tabular-nums;line-height:1;margin:30px 0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #466455;background:#18251d;color:inherit}button{cursor:pointer;margin:5px}.primary{background:#a5f2bd;color:#122018;border:0;font-weight:bold}</style><div class="app"><h1>Focus Sprint</h1><p>Choose a sprint length, then give one thing your attention.</p><label>Minutes <input id="mins" type="number" min="1" max="120" value="25" style="width:80px"></label><div class="clock" id="clock">25:00</div><button class="primary" id="toggle">Start focus</button><button id="reset">Reset</button><p>Completed sprints: <b id="done">0</b></p></div><script>let left=1500,timer=null,done=+(localStorage.sprints||0);const clock=document.querySelector('#clock');document.querySelector('#done').textContent=done;function draw(){clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}document.querySelector('#mins').onchange=e=>{left=Math.max(1,Math.min(120,+e.target.value||25))*60;draw()};document.querySelector('#toggle').onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent='Resume focus'}else{e.target.textContent='Pause';timer=setInterval(()=>{left--;draw();if(left<=0){clearInterval(timer);timer=null;done++;localStorage.sprints=done;document.querySelector('#done').textContent=done;e.target.textContent='Start focus';document.title='Sprint complete!';alert('Sprint complete. Take a short break.')}},1000)}};document.querySelector('#reset').onclick=()=>{clearInterval(timer);timer=null;left=(+document.querySelector('#mins').value||25)*60;document.querySelector('#toggle').textContent='Start focus';draw()};draw()</script></html>
