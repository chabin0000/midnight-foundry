<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Dodger</title><style>*{box-sizing:border-box}body{margin:0;background:#080b18;color:#e6eaff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(94vw,600px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}a{color:#aebdff}canvas{width:100%;background:radial-gradient(ellipse at 50% 100%,#18244b,#090d1e 65%);border:1px solid #27335a;border-radius:18px;touch-action:none}.controls{color:#aeb8dc;text-align:center;font-size:.9rem}button{background:#283969;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}#overlay{position:fixed;inset:0;background:#070a13bb;display:grid;place-items:center;text-align:center}#overlay[hidden]{display:none}</style><main><header><a href="../">← Tiny Experiments</a><b>🛰️ Orbit Dodger</b><span>Score <strong id="score">0</strong> · Best <strong id="best">0</strong></span></header><canvas id="c" width="600" height="440"></canvas><p class="controls">Move with ← → or A / D · Touch and drag on mobile</p></main><div id="overlay"><div><h1>Orbit Dodger</h1><p>Dodge asteroids. Stay in orbit.</p><button id="start">Launch</button></div></div><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),ov=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let run=false,player={x:300},rocks=[],score=0,keys={};bestEl.textContent=localStorage.orbitBest||0;function launch(){run=true;score=0;rocks=[];player.x=300;ov.hidden=true;frame()}document.querySelector('#start').onclick=launch;onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(!run&&e.key==='Enter')launch()};onkeyup=e=>keys[e.key.toLowerCase()]=false;c.onpointermove=e=>{if(e.buttons){player.x=(e.clientX-c.getBoundingClientRect().left)*600/c.clientWidth}};function frame(){if(!run)return;ctx.clearRect(0,0,600,440);ctx.fillStyle='#dce4ff';ctx.beginPath();ctx.arc(player.x,390,10,0,7);ctx.fill();ctx.fillStyle='#8398ff';ctx.fillRect(player.x-2,397,4,15);if(Math.random()<.045)rocks.push({x:20+Math.random()*560,y:-20,r:10+Math.random()*15,v:2+score/450});rocks.forEach(r=>{r.y+=r.v;ctx.fillStyle='#b77b75';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.fill();if(Math.hypot(r.x-player.x,r.y-390)<r.r+9){run=false;let b=Math.max(score,+localStorage.orbitBest||0);localStorage.orbitBest=b;bestEl.textContent=b;ov.querySelector('h1').textContent='Mission complete';ov.querySelector('p').textContent=`You scored ${score}. Ready for another orbit?`;ov.hidden=false}});rocks=rocks.filter(r=>r.y<470);if(keys.arrowleft||keys.a)player.x-=5;if(keys.arrowright||keys.d)player.x+=5;player.x=Math.max(12,Math.min(588,player.x));score++;scoreEl.textContent=Math.floor(score/6);requestAnimationFrame(frame)}
</script></html>
