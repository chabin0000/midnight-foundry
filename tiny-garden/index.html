<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny Garden</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0df;color:#293d31;font:16px system-ui}main{max-width:760px;margin:5vh auto;padding:20px}a{color:#496a4c}h1{font-size:3rem;margin:20px 0 4px}.sub{color:#73816e}.bar{display:flex;justify-content:space-between;align-items:center;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.plot{aspect-ratio:1;border:0;border-radius:18px;background:#dfd9bf;font-size:3rem;cursor:pointer;transition:.2s}.plot:hover{transform:scale(1.04)}button.action{border:0;background:#416b4c;color:white;padding:12px 18px;border-radius:12px;font-size:1rem;cursor:pointer}#note{min-height:28px;color:#58734f}</style><main><a href="../">← Tiny Experiments</a><h1>🌿 Tiny Garden</h1><div class="sub">A little patience, a little water.</div><div class="bar"><span id="score">Seeds: 6</span><button class="action" id="water">💧 Water all</button></div><div class="grid" id="garden"></div><p id="note">Choose an empty plot to plant a seed.</p></main><script>
let beds=JSON.parse(localStorage.gardenBeds||'null')||Array(12).fill(0),seeds=6;const g=document.querySelector('#garden'),score=document.querySelector('#score'),note=document.querySelector('#note');function render(){g.innerHTML='';beds.forEach((v,i)=>{let b=document.createElement('button');b.className='plot';b.textContent=['','🌱','🌿','🌷'][v];b.title=v?'Growing plant':'Empty plot';b.onclick=()=>{if(v===0&&seeds){beds[i]=1;seeds--;save();note.textContent='A seed is in the soil. Give it a drink!'}else if(v===3){beds[i]=0;seeds+=2;save();note.textContent='Lovely bloom! You gathered two seeds.'}};g.append(b)});score.textContent=`Seeds: ${seeds}`;localStorage.gardenBeds=JSON.stringify(beds)}function save(){localStorage.gardenSeeds=seeds;render()}if(localStorage.gardenSeeds)seeds=+localStorage.gardenSeeds;document.querySelector('#water').onclick=()=>{let grew=0;beds=beds.map(v=>{if(v===1){grew++;return 2}if(v===2){grew++;return 3}return v});note.textContent=grew?`A refreshing shower! ${grew} plant${grew===1?'':'s'} grew.`:'Nothing needs watering yet.';save()};render();</script></html>
